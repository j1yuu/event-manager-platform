server:
  port: ${EN_SERVER_PORT:8081}
  error:
    include-errors: true

spring:
  application:
    name: event-notificator

  datasource:
    url: ${EN_DB_URL:jdbc:postgresql://localhost:5433/event-notificator}
    username: ${EN_DB_USERNAME:admin}
    password: ${EN_DB_PASSWORD:test}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: event-notificator

    consumer:
      group-id: event-notificator

      enable-auto-commit: false
      auto-offset-reset: earliest

      properties:
        "[spring.json.use.type.headers]": false
        "[spring.json.trusted.packages]": kkashin.dev.eventcommon.kafka

    listener:
      type: single
      ack-mode: record
      concurrency: 1
      missing-topics-fatal: true
      log-container-config: true

logging:
  level:
    root: INFO
    org.springframework.web: INFO

event-manager:
  jwt:
    issuer: ${JWT_ISSUER}
    access-ttl: ${JWT_TTL}
    secret-base64: ${JWT_SECRET}

  kafka:
    topics:
      event-changed:
        name: ${KAFKA_EVENT_CHANGED_TOPIC:event-manager.event-changed}
        group-id: ${KAFKA_EVENT_CHANGED_CONSUMER_GROUP:event-notificator-event-changed}

      user-created:
        name: ${KAFKA_USER_CREATED_TOPIC:event-manager.user-created}
        group-id: ${KAFKA_USER_CREATED_CONSUMER_GROUP:event-notificator-user-created}