server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: event-manager

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/event-manager}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:test}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog-master.yaml

logging:
  level:
    root: INFO
    org.springframework.web: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: Event Manager API
        url: /docs/openapi/event-manager.openapi.yaml
      - name: Event Notificator API
        url: /docs/openapi/event-notificator.openapi.yaml
    urls-primary-name: Event Manager API